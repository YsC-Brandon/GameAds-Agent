name: Bug report
description: Report a reproducible issue in the local synthetic-data demo
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, personal information, databases, reports, real
        business data, or exploit details. This project is a local demonstration;
        no production or remote service is supported.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the behavior without sensitive data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction steps
      description: Include the command and synthetic inputs needed to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and Python versions
      placeholder: Windows 11, Python 3.11.x
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true