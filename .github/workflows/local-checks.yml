name: Windows public-source CI

# This is a public-source regression pipeline, not frozen Phase 4 acceptance.
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GAMEADS_LLM_API_KEY: ''
      GAMEADS_LLM_MODEL: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install declared environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -c requirements-windows-py311.lock -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run public-source checks (two private-history tests excluded)
        shell: pwsh
        run: |
          .\scripts\check_public.ps1 -EvidenceDir 'docs\generated\ci-public-check'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# Digests resolved read-only against upstream tags; evidence in the final sprint.
# Configuration is not evidence of a remote run or a Phase 4 gate PASS.