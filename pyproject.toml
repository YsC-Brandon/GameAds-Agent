[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "gameads-agent"
version = "0.1.0"
description = "An agentic assistant for game advertising analytics and budget simulation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "YsC-Brandon" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn==0.54.0",
    "h11==0.16.0",
    "pandas>=3.1,<3.2",
    "langgraph>=1.2,<2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "jsonschema>=4.26,<5",
    "openapi-spec-validator>=0.9,<0.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/sample_campaigns.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]